name: みんなの声 を Cloudflare に公開

# main に変更が入ったとき、または Actions 画面から手動で実行したときに公開する
on:
  push:
    branches: [main]
    # 管理アプリだけの変更ではサイトを公開し直さない
    paths-ignore: ["android/**", ".github/workflows/admin-app.yml"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.VOTE_ADMIN_TOKEN }}
      PHONE_PEPPER: ${{ secrets.VOTE_PHONE_PEPPER }}
      LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      WRANGLER: npx --yes wrangler@4.156.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 必要な Secrets がそろっているか確認
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_TOKEN PHONE_PEPPER; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Secrets が足りません:$missing（ADMIN_TOKEN は VOTE_ADMIN_TOKEN、PHONE_PEPPER は VOTE_PHONE_PEPPER という名前で登録）"
            exit 1
          fi

      - name: D1 データベースを用意して wrangler.jsonc に ID を書き込む
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "minnano-koe") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create minnano-koe
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "minnano-koe") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::D1 データベースを用意できませんでした"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: テーブルを作る（すでにあれば何もしない）
        run: $WRANGLER d1 execute minnano-koe --remote --file=schema.sql

      - name: データベースの変更を当てる（migrations/ のうち、まだのものだけ）
        run: $WRANGLER d1 migrations apply minnano-koe --remote

      - name: 公開
        run: $WRANGLER deploy

      - name: 秘密の値を Worker に登録
        run: |
          # LINE と Turnstile は登録されているものだけ渡す（未登録なら、その機能は「準備中」になる）
          jq -n --arg a "$ADMIN_TOKEN" --arg p "$PHONE_PEPPER" \
                --arg li "$LINE_CHANNEL_ID" --arg ls "$LINE_CHANNEL_SECRET" \
                --arg tk "$TURNSTILE_SITE_KEY" --arg ts "$TURNSTILE_SECRET_KEY" \
                '{ADMIN_TOKEN:$a, PHONE_PEPPER:$p, LINE_CHANNEL_ID:$li, LINE_CHANNEL_SECRET:$ls, TURNSTILE_SITE_KEY:$tk, TURNSTILE_SECRET_KEY:$ts}
                 | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          $WRANGLER secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: SMS 廃止で使わなくなった Twilio の鍵を Worker から消す（すでに無ければ何もしない）
        run: |
          for n in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SID; do
            echo y | $WRANGLER secret delete "$n" >/dev/null 2>&1 && echo "削除: $n" || echo "なし: $n"
          done
