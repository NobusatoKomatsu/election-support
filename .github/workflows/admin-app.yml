name: 管理アプリ（Android）をビルド

# プルリクエストではビルドだけ確認し、main に入ったらリリース「admin-app」に APK を置く
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/admin-app.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/admin-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: 署名用の鍵を復元（Secrets が無ければデバッグ用の鍵で署名）
        env:
          KEYSTORE_B64: ${{ secrets.ADMIN_APP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"; fi

      - name: APK をビルド
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ADMIN_APP_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: プルリクエストでは成果物として保存
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: election-admin-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: リリース「admin-app」に置く
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk election-admin.apk
          gh release view admin-app >/dev/null 2>&1 || gh release create admin-app \
            --title "みんなの声 管理アプリ（Android）" \
            --notes "election-admin.apk をスマホでダウンロードしてインストールしてください。"
          gh release upload admin-app election-admin.apk --clobber
          gh release edit admin-app --notes "election-admin.apk をスマホでダウンロードしてインストールしてください。（ビルド ${{ github.run_number }}）"
